global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: opencex
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090", "opencex-metrics:9090"]
        labels: { service: opencex }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
