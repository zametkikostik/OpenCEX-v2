[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencex-rpc"
version = "0.4.0"
description = "OpenCEX infrastructure: RPC router + 0x liquidity + Swap API + ZK-KYC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "zametkikostik" }]
dependencies = [
    "web3>=6.0.0,<8",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
django = ["Django>=3.2", "djangorestframework>=3.12"]

[tool.setuptools.packages.find]
include = ["opencex_rpc*", "opencex_liquidity*", "opencex_swap_api*", "opencex_kyc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
